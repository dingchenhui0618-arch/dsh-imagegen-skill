name: CI

# The package is plain ESM with no dependencies and no build step; the tests are
# the contract for the provider (bundled skill is registered, SKILL.md parses,
# cordis.patch.yml inserts the published name, no machine-local details leak).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Provider contract tests
        run: npm test
